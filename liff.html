<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบแจ้งซ่อม — LINE</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/theme.css?v=0.4.0" rel="stylesheet">
</head>
<body>
<div class="rr-login">
  <div class="rr-login-card">
    <div class="rr-login-head">
      <h1>เชื่อมต่อกับ LINE</h1>
      <p id="msg">กำลังตรวจสอบ...</p>
    </div>
    <div class="rr-login-body">
      <div id="act" class="hide">
        <a class="btn btn-primary w-100" id="goApp">เข้าสู่ระบบแจ้งซ่อม</a>
      </div>
    </div>
  </div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="js/config.js?v=0.1.0"></script>
<script src="js/ui.js?v=0.1.0"></script>
<script src="js/api.js?v=0.1.0"></script>
<script>
/* =====================================================================
   liff.html — ปลายทาง LIFF endpoint
   1) init liff ด้วย liff_id ที่ตั้งไว้ในหน้าตั้งค่า
   2) ถ้า login ระบบไว้แล้ว จะผูก LINE userId ให้อัตโนมัติ (line.bind)
   3) ส่งต่อเข้าแอปหลัก โดยคง deep link เดิม เช่น liff.html?p=/tickets
   ===================================================================== */
(function () {
  var msg = document.getElementById('msg');
  var qs  = new URLSearchParams(location.search);
  var target = 'index.html#' + (qs.get('p') || '/dashboard');
  document.getElementById('goApp').href = target;

  function show(text, done) {
    msg.textContent = text;
    if (done) document.getElementById('act').classList.remove('hide');
  }

  SP.api('app.info', {}, { silent: true })
    .then(function (info) {
      if (!info.liff_id) { show('ยังไม่ได้ตั้งค่า LIFF ID ในหน้าตั้งค่า', true); return null; }
      return liff.init({ liffId: info.liff_id });
    })
    .then(function (r) {
      if (r === null) return;
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      return liff.getProfile();
    })
    .then(function (profile) {
      if (!profile) return;
      if (!SP.token.get()) {
        sessionStorage.setItem('rr_line_pending', JSON.stringify({
          line_user_id: profile.userId, display_name: profile.displayName
        }));
        show('สวัสดี ' + profile.displayName + ' — เข้าสู่ระบบเพื่อผูกบัญชี', true);
        setTimeout(function () { location.href = target; }, 1200);
        return;
      }
      return SP.api('line.bind', {
        line_user_id: profile.userId, display_name: profile.displayName
      }, { silent: true }).then(function () {
        show('ผูกบัญชีกับ LINE เรียบร้อย', true);
        setTimeout(function () { location.href = target; }, 900);
      });
    })
    .catch(function (e) { show('ผิดพลาด: ' + (e.message || e), true); });
})();
</script>
</body>
</html>
