<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#163B2E">
<title>ระบบแจ้งซ่อม</title>

<link rel="icon" href="assets/img/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/css/theme.css?v=0.1.0" rel="stylesheet">
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="viewLogin" class="rr-login hide">
  <div class="rr-login-card">
    <div class="rr-login-head">
      <img id="loginLogo" src="assets/img/logo.png" alt="" onerror="this.style.display='none'">
      <h1 id="loginTitle">ระบบแจ้งซ่อม</h1>
      <p id="loginOrg">เข้าสู่ระบบเพื่อใช้งาน</p>
    </div>
    <div class="rr-login-body">
      <div class="mb-3">
        <label class="form-label">ชื่อผู้ใช้</label>
        <input type="text" id="inUser" class="form-control" autocomplete="username" autocapitalize="off" spellcheck="false">
      </div>
      <div class="mb-3">
        <label class="form-label">รหัสผ่าน</label>
        <div class="input-group">
          <input type="password" id="inPass" class="form-control" autocomplete="current-password">
          <button class="btn btn-outline-secondary" type="button" id="btnEye"><i class="bi bi-eye"></i></button>
        </div>
      </div>
      <div id="loginErr" class="alert alert-danger py-2 px-3 small hide"></div>
      <button class="btn btn-primary w-100" id="btnLogin">เข้าสู่ระบบ</button>
    </div>
    <div class="rr-login-foot">
      <span id="loginVer">v0.1.0</span>
    </div>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="viewApp" class="hide">

  <aside class="rr-sidebar">
    <div class="rr-brand">
      <img id="sbLogo" src="assets/img/logo.png" alt="" onerror="this.style.visibility='hidden'">
      <div>
        <div class="t" id="sbName">ระบบแจ้งซ่อม</div>
        <div class="s" id="sbOrg"></div>
      </div>
    </div>
    <nav class="rr-nav" id="sbNav"></nav>
    <div style="height:24px"></div>
  </aside>

  <div class="rr-backdrop" onclick="document.body.classList.remove('nav-open')"></div>

  <header class="rr-topbar">
    <button class="rr-burger" onclick="document.body.classList.toggle('nav-open')"><i class="bi bi-list"></i></button>
    <span class="org" id="tbOrg"></span>
    <span class="spacer"></span>
    <div class="rr-user">
      <div class="text-end d-none d-sm-block">
        <div class="nm" id="tbName">-</div>
        <div class="rl" id="tbRole">-</div>
      </div>
      <div class="rr-avatar" id="tbAvatar">-</div>
      <button class="btn btn-sm btn-outline-secondary" onclick="SP.auth.logout()"><i class="bi bi-box-arrow-right"></i></button>
    </div>
  </header>

  <main class="rr-main" id="rrPage"></main>
</div>

<!-- ============ SHARED MODAL (ตัวเดียวใช้ทุกหน้า) ============ -->
<div class="modal fade" id="rrModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered" id="rrModalDialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="rrModalTitle">-</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="rrModalBody"></div>
      <div class="modal-footer" id="rrModalFoot"></div>
    </div>
  </div>
</div>

<div id="rrToast"></div>
<div id="rrBusy"><div class="rr-spin"></div></div>
<div id="printArea"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/config.js?v=0.1.0"></script>
<script src="js/ui.js?v=0.1.0"></script>
<script src="js/api.js?v=0.1.0"></script>
<script src="js/auth.js?v=0.1.0"></script>
<script src="js/camera.js?v=0.2.0"></script>
<script src="js/app.js?v=0.3.0"></script>
<script src="js/pages/tickets.js?v=0.3.0"></script>
<script src="js/pages/work.js?v=0.3.0"></script>
<script src="js/pages/approval.js?v=0.3.0"></script>
<script src="js/pages/qr.js?v=0.4.0"></script>
<script src="js/pages/reports.js?v=0.4.0"></script>
<script src="js/pages/settings.js?v=0.4.0"></script>
</body>
</html>
